  .wrap{
    max-width:560px;
    margin:0 auto;
    padding-inline:18px;
    padding-block:0 40px;
    position:relative;
    z-index:1;
  }

  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:5;
    background:var(--bg);
    padding-block:18px 12px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .brand h1{
    font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    text-wrap:balance;
  }
  .brand .mark{
    color:var(--accent);
  }
  .date-tag{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .slogan{
    font-family:'Karla',sans-serif;
    font-style:italic;
    font-weight:500;
    font-size:13px;
    color:var(--accent);
    margin:3px 0 0;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:99px;
    background:var(--line-soft);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:99px;
    background:var(--done);
    width:0%;
    transition:width .35s ease;
  }
  .progress-label{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  form#add-form{
    margin-top:16px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  .add-row1{
    display:flex;
    gap:8px;
  }
  .add-row1 input[type="text"]{
    flex:1;
    min-width:0;
  }
  .add-row2{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  input[type="text"], select{
    font-family:'Karla',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
  }
  input[type="text"]:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  input#item-qty{ width:110px; }
  select#item-cat{ flex:1; min-width:0; }
  ::placeholder{ color:var(--ink-faint); }

  button#add-btn{
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--accent-ink);
    background:var(--accent);
    border:none;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    white-space:nowrap;
  }
  button#add-btn:active{ transform:translateY(1px); }
  button#add-btn:focus-visible, input:focus-visible, select:focus-visible, .check:focus-visible, .del:focus-visible, .clear-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .aisle{
    display:flex;
    flex-direction:column;
  }
  .aisle-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .aisle-dot{
    width:9px; height:9px;
    border-radius:99px;
    background:var(--cat-color, var(--accent));
    flex:none;
  }
  .aisle-head h2{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:0;
  }
  .aisle-count{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    color:var(--ink-faint);
    margin-left:auto;
  }

  .items{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-bottom:1px solid var(--line-soft);
  }
  .item:last-child{ border-bottom:none; }

  .check{
    flex:none;
    width:24px;
    height:24px;
    border-radius:8px;
    border:2px solid var(--line);
    background:var(--surface);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .check svg{
    width:14px; height:14px;
    opacity:0;
    transform:scale(0.6);
    transition:opacity .15s ease, transform .15s ease;
  }
  .item.done .check{
    background:var(--done);
    border-color:var(--done);
  }
  .item.done .check svg{ opacity:1; transform:scale(1); }

  .item-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .item-name{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  .item.done .item-name{
    color:var(--ink-faint);
    text-decoration:line-through;
    text-decoration-color:var(--ink-faint);
  }
  .item-qty{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .item.done .item-qty{ color:var(--ink-faint); }

  .del{
    flex:none;
    width:28px; height:28px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--ink-faint);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .del:hover{ background:var(--line-soft); color:var(--remove); }
  .del svg{ width:16px; height:16px; }

  .footer-actions{
    display:flex;
    justify-content:center;
    margin-top:24px;
  }
  .clear-btn{
    font-family:'Karla',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--remove);
    background:transparent;
    border:1px solid var(--line);
    border-radius:99px;
    padding:9px 18px;
    cursor:pointer;
  }
  .clear-btn:hover{ background:var(--line-soft); }
  .clear-btn[hidden]{ display:none; }

  .empty{
    margin-top:40px;
    text-align:center;
    color:var(--ink-soft);
    padding:32px 20px;
    border:1px dashed var(--line);
    border-radius:16px;
  }
  .empty .big{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .empty[hidden]{ display:none; }

  @media (max-width:420px){
    .brand h1{ font-size:22px; }
    input#item-qty{ width:88px; }
  }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Guru <span class="mark">&amp;</span> Vaishnavi</h1>
      <span class="date-tag" id="today-tag"></span>
    </div>
    <p class="slogan">Good food starts with a good list.</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 / 0</span>
    </div>
  </header>

  <form id="add-form" autocomplete="off">
    <div class="add-row1">
      <input type="text" id="item-name" placeholder="Add an item… (e.g. Toor dal)" required />
      <input type="text" id="item-qty" placeholder="Qty (e.g. 1 kg)" />
    </div>
    <div class="add-row2">
      <select id="item-cat"></select>
      <button type="submit" id="add-btn">Add</button>
    </div>
  </form>

  <div class="list" id="list"></div>

  <div class="empty" id="empty-state" hidden>
    <div class="big">Your basket is empty</div>
    <div>Add the first item above to start today's list.</div>
  </div>

  <div class="footer-actions">
    <button class="clear-btn" id="clear-btn" hidden>Clear picked-up items</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CATEGORIES = [
    { id: "produce",  label: "Vegetables & Fruits",       color: "#5c9c4c" },
    { id: "dairy",    label: "Dairy & Eggs",               color: "#4a8fc9" },
    { id: "pantry",   label: "Grains, Pulses & Spices",    color: "#c97a2b" },
    { id: "snacks",   label: "Snacks & Beverages",         color: "#b0552f" },
    { id: "household",label: "Household & Cleaning",       color: "#6f7fc9" },
    { id: "personal", label: "Personal Care",               color: "#a15c9c" },
    { id: "other",    label: "Other",                       color: "#93998f" }
  ];
  var CAT_MAP = {};
  CATEGORIES.forEach(function(c){ CAT_MAP[c.id] = c; });

  var STORAGE_KEY = "kirana-list.items.v1";

  var EXAMPLE_ITEMS = [
    { id: "ex1", name: "Toor dal",        qty: "1 kg",    cat: "pantry",   done: false },
    { id: "ex2", name: "Tomatoes",        qty: "1/2 kg",  cat: "produce",  done: false },
    { id: "ex3", name: "Milk",            qty: "1 L",     cat: "dairy",    done: true  },
    { id: "ex4", name: "Coriander leaves",qty: "1 bunch", cat: "produce",  done: false },
    { id: "ex5", name: "Dish wash bar",   qty: "2",       cat: "household",done: false }
  ];

  function loadItems(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return parsed;
      }
    }catch(e){}
    return EXAMPLE_ITEMS.slice();
  }

  function saveItems(items){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){}
  }

  var items = loadItems();

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty-state");
  var clearBtn = document.getElementById("clear-btn");
  var progressFill = document.getElementById("progress-fill");
  var progressLabel = document.getElementById("progress-label");
  var catSelect = document.getElementById("item-cat");
  var form = document.getElementById("add-form");
  var nameInput = document.getElementById("item-name");
  var qtyInput = document.getElementById("item-qty");
  var todayTag = document.getElementById("today-tag");

  todayTag.textContent = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });

  CATEGORIES.forEach(function(c){
    var opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.label;
    catSelect.appendChild(opt);
  });

  function uid(){
    return "it_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(ch){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch];
    });
  }

  function render(){
    listEl.innerHTML = "";

    if(items.length === 0){
      emptyEl.hidden = false;
      clearBtn.hidden = true;
      progressFill.style.width = "0%";
      progressLabel.textContent = "0 / 0";
      return;
    }
    emptyEl.hidden = true;

    var doneCount = items.filter(function(i){ return i.done; }).length;
    var total = items.length;
    progressFill.style.width = (total ? Math.round(doneCount/total*100) : 0) + "%";
    progressLabel.textContent = doneCount + " / " + total;
    clearBtn.hidden = doneCount === 0;

    CATEGORIES.forEach(function(cat){
      var catItems = items.filter(function(i){ return i.cat === cat.id; });
      if(catItems.length === 0) return;

      catItems.sort(function(a,b){
        if(a.done !== b.done) return a.done ? 1 : -1;
        return 0;
      });

      var aisle = document.createElement("div");
      aisle.className = "aisle";

      var head = document.createElement("div");
      head.className = "aisle-head";
      head.innerHTML =
        '<span class="aisle-dot" style="--cat-color:' + cat.color + '"></span>' +
        '<h2>' + escapeHtml(cat.label) + '</h2>' +
        '<span class="aisle-count">' + catItems.filter(function(i){return i.done;}).length + '/' + catItems.length + '</span>';
      aisle.appendChild(head);

      var box = document.createElement("div");
      box.className = "items";

      catItems.forEach(function(item){
        var row = document.createElement("div");
        row.className = "item" + (item.done ? " done" : "");
        row.innerHTML =
          '<button class="check" aria-label="Mark ' + escapeHtml(item.name) + (item.done ? ' as not picked up' : ' as picked up') + '" data-id="' + item.id + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>' +
          '</button>' +
          '<div class="item-main">' +
            '<span class="item-name">' + escapeHtml(item.name) + '</span>' +
            (item.qty ? '<span class="item-qty">' + escapeHtml(item.qty) + '</span>' : '') +
          '</div>' +
          '<button class="del" aria-label="Remove ' + escapeHtml(item.name) + '" data-id="' + item.id + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
          '</button>';
        box.appendChild(row);
      });

      aisle.appendChild(box);
      listEl.appendChild(aisle);
    });
  }

  listEl.addEventListener("click", function(e){
    var checkBtn = e.target.closest(".check");
    if(checkBtn){
      var id = checkBtn.getAttribute("data-id");
      var item = items.find(function(i){ return i.id === id; });
      if(item){
        item.done = !item.done;
        saveItems(items);
        render();
      }
      return;
    }
    var delBtn = e.target.closest(".del");
    if(delBtn){
      var did = delBtn.getAttribute("data-id");
      items = items.filter(function(i){ return i.id !== did; });
      saveItems(items);
      render();
    }
  });

  clearBtn.addEventListener("click", function(){
    items = items.filter(function(i){ return !i.done; });
    saveItems(items);
    render();
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameInput.value.trim();
    if(!name) return;
    var qty = qtyInput.value.trim();
    var cat = catSelect.value || "other";
    items.push({ id: uid(), name: name, qty: qty, cat: cat, done: false });
    saveItems(items);
    nameInput.value = "";
    qtyInput.value = "";
    nameInput.focus();
    render();
  });

  render();
})();
</script>

</body>
</html>
